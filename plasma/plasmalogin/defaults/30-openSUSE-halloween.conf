# Installed by the optional defaults into /usr/lib/plasmalogin/plasmalogin.conf.d,
# where vendor defaults live: gives Plasma Login Manager's greeter the Halloween
# login background. A background picked in System Settings (written to
# /etc/plasmalogin.conf) still wins; drop-ins in /etc/plasmalogin.conf.d don't,
# as the greeter reads them before this folder. A path, not a file:// URL:
# System Settings copies a URL's file into its own folder whenever it saves.
[Greeter][Wallpaper][org.kde.image][General]
Image=/usr/share/openSUSE-halloween/plasmalogin/background.jpg
